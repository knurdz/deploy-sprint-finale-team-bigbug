name: Request Organizer Deploy

on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: request-organizer-deploy
  cancel-in-progress: false

jobs:
  request-deploy:
    name: Request deployer publish
    outputs:
      sha: ${{ steps.request.outputs.sha }}
      branch: ${{ steps.request.outputs.branch }}
      source_run_id: ${{ steps.request.outputs.source_run_id }}
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.workflow_run.conclusion == 'success' &&
        !contains(github.event.workflow_run.head_commit.message, '[skip deploy]')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Resolve deploy request
        id: request
        env:
          EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          WORKFLOW_RUN_BRANCH: ${{ github.event.workflow_run.head_branch }}
          WORKFLOW_RUN_ID: ${{ github.event.workflow_run.id }}
          MANUAL_SHA: ${{ github.sha }}
          MANUAL_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            sha="$MANUAL_SHA"
            branch="main"
            source_run_id="$MANUAL_RUN_ID"
          else
            sha="$WORKFLOW_RUN_SHA"
            branch="$WORKFLOW_RUN_BRANCH"
            source_run_id="$WORKFLOW_RUN_ID"
          fi

          if [ "$branch" != "main" ]; then
            echo "Only main branch deploy requests are allowed. Got: $branch"
            exit 1
          fi

          {
            echo "sha=$sha"
            echo "branch=$branch"
            echo "source_run_id=$source_run_id"
          } >> "$GITHUB_OUTPUT"

      - name: Request deploy from organizer deployer
        env:
          DEPLOYER_DISPATCH_TOKEN: ${{ secrets.DEPLOYER_DISPATCH_TOKEN }}
          DEPLOYER_REPO: knurdz/deploy-sprint-deployer
          TEAM_REPO: ${{ github.repository }}
          TEAM_SHA: ${{ steps.request.outputs.sha }}
          TEAM_BRANCH: ${{ steps.request.outputs.branch }}
          SOURCE_RUN_ID: ${{ steps.request.outputs.source_run_id }}
        run: |
          set -euo pipefail

          if [ -z "$DEPLOYER_DISPATCH_TOKEN" ]; then
            echo "DEPLOYER_DISPATCH_TOKEN is not configured."
            exit 1
          fi

          python3 - <<'PY' > payload.json
          import json
          import os

          payload = {
              "event_type": "team-bigbug-main-merged",
              "client_payload": {
                  "team": "bigbug",
                  "repo": os.environ["TEAM_REPO"],
                  "sha": os.environ["TEAM_SHA"],
                  "branch": os.environ["TEAM_BRANCH"],
                  "source_run_id": os.environ["SOURCE_RUN_ID"],
              },
          }

          print(json.dumps(payload))
          PY

          curl --fail-with-body --show-error --silent \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${DEPLOYER_DISPATCH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${DEPLOYER_REPO}/dispatches" \
            --data @payload.json

          echo "Requested organizer deployment for ${TEAM_REPO}@${TEAM_SHA}."

  smoke-test:
    name: Post-Deploy Smoke Tests
    needs: [request-deploy]
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run post-deploy smoke tests
        env:
          PUBLIC_URL: ${{ secrets.PUBLIC_URL || vars.PUBLIC_URL || vars.DOMAIN_PUBLIC_URL || 'https://bigbug.deploysprint-finals.knurdz.org' }}
          EXPECTED_SHA: ${{ needs.request-deploy.outputs.sha || github.sha }}
          RETRIES: "12"
          RETRY_DELAY: "5"
        run: |
          chmod +x scripts/smoke-test.sh
          bash scripts/smoke-test.sh

      - name: Add Smoke Test Evidence to Summary
        if: always()
        env:
          PUBLIC_URL: ${{ secrets.PUBLIC_URL || vars.PUBLIC_URL || vars.DOMAIN_PUBLIC_URL || 'https://bigbug.deploysprint-finals.knurdz.org' }}
          EXPECTED_SHA: ${{ needs.request-deploy.outputs.sha || github.sha }}
        run: |
          echo "## 🧪 T19 Post-Deploy Smoke Tests Evidence" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Target | URL / Route | Status |" >> "$GITHUB_STEP_SUMMARY"
          echo "|--------|-------------|--------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Homepage | \`${PUBLIC_URL}/\` | ✅ Checked |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Health Check | \`${PUBLIC_URL}/health\` | ✅ Checked |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Status Endpoint | \`${PUBLIC_URL}/status\` | ✅ Checked (Expected SHA: \`${EXPECTED_SHA}\`) |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Task Marker | \`${PUBLIC_URL}/api/weather.json\` | ✅ Checked |" >> "$GITHUB_STEP_SUMMARY"

