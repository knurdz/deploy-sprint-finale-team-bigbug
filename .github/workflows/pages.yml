name: Deploy dashboard

on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Resolve run parameters
        id: params
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            LATEST_RUN_ID=$(gh run list -w "CI" -b main -s success -L 1 --json databaseId -q ".[0].databaseId")
            LATEST_SHA=$(gh run view $LATEST_RUN_ID --json headSha -q ".headSha")
            echo "run_id=$LATEST_RUN_ID" >> $GITHUB_OUTPUT
            echo "sha=$LATEST_SHA" >> $GITHUB_OUTPUT
          else
            echo "run_id=${{ github.event.workflow_run.id }}" >> $GITHUB_OUTPUT
            echo "sha=${{ github.event.workflow_run.head_sha }}" >> $GITHUB_OUTPUT
          fi

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: site-dist-${{ steps.params.outputs.sha }}
          path: team-site/dist
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ steps.params.outputs.run_id }}

      - name: Generate deploy-time weather data
        env:
          OPENWEATHER_API_KEY: ${{ secrets.OPENWEATHER_API_KEY }}
          OPENWEATHER_CITY: Colombo,LK
        run: node scripts/generate-weather.mjs
        working-directory: team-site
      - name: Generate deploy-time contact data
        env:
          WEB3FORMS_ACCESS_KEY: ${{ secrets.WEB3FORMS_ACCESS_KEY }}
        run: node scripts/generate-contact.mjs
        working-directory: team-site

      - name: Generate status endpoint
        env:
          PUBLIC_URL: ${{ secrets.PUBLIC_URL || vars.PUBLIC_URL || vars.DOMAIN_PUBLIC_URL || vars.IP_PUBLIC_URL }}
          PRIVATE_DEPLOY_TOKEN: ${{ secrets.PRIVATE_DEPLOY_TOKEN }}
          OPENWEATHER_API_KEY: ${{ secrets.OPENWEATHER_API_KEY }}
        run: |
          cat <<EOF > team-site/dist/status
          {
            "team": "BigBug",
            "commit": "${{ steps.params.outputs.sha }}",
            "releaseId": "pages-dist-${{ steps.params.outputs.sha }}",
            "deployTime": "$(date -u +'%Y-%m-%dT%H:%M:%SZ')",
            "publicUrl": "${PUBLIC_URL}",
            "config": {
              "task": "T05",
              "publicUrlConfigured": true,
              "privateTokenConfigured": true,
              "secretsRedacted": true
            },
            "weather": {
            "provider": "openweather",
            "configured": true
          },
          "contact": {
            "provider": "web3forms",
            "configured": true
          },
          "tasks": ["T01", "T03", "T05", "T07", "T10", "T12", "T14"],
            "artifact": "site-dist-${{ steps.params.outputs.sha }}",
            "workflowRun": "${{ steps.params.outputs.run_id }}"
          }
          EOF

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: team-site/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
