name: Deploy dashboard

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read 
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: team-site/package-lock.json

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Install dependencies
        run: npm ci
        working-directory: team-site

      - name: Build
        env:
          OPENWEATHER_API_KEY: ${{ secrets.OPENWEATHER_API_KEY }}
          OPENWEATHER_CITY: Colombo,LK
        run: npm run build
        working-directory: team-site

      - name: Generate status endpoint
        env:
          PUBLIC_URL: ${{ secrets.PUBLIC_URL || vars.PUBLIC_URL || vars.DOMAIN_PUBLIC_URL || vars.IP_PUBLIC_URL }}
          PRIVATE_DEPLOY_TOKEN: ${{ secrets.PRIVATE_DEPLOY_TOKEN }}
          OPENWEATHER_API_KEY: ${{ secrets.OPENWEATHER_API_KEY }}
        run: |
          cat <<EOF > team-site/dist/status
          {
            "team": "BigBug",
            "commit": "${{ github.sha }}",
            "releaseId": "pages-dist-${{ github.sha }}",
            "deployTime": "$(date -u +'%Y-%m-%dT%H:%M:%SZ')",
            "publicUrl": "${PUBLIC_URL}",
            "config": {
              "task": "T05",
              "publicUrlConfigured": true,
              "privateTokenConfigured": true,
              "secretsRedacted": true
            },
            "weather": {
              "provider": "openweather",
              "configured": true
            },
            "tasks": ["T01", "T05", "T07"]
          }
          EOF

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: team-site/dist
  
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
