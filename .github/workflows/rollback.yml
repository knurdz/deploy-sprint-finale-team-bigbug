name: Rollback Release

on:
  workflow_dispatch:
    inputs:
      release_ref:
        description: 'Known-good tag, SHA, or artifact ID to redeploy'
        required: true

permissions:
  contents: read

concurrency:
  group: request-organizer-deploy
  cancel-in-progress: false

jobs:
  rollback:
    name: Rollback to known-good release
    runs-on: ubuntu-latest
    steps:
      - name: Validate rollback target
        run: |
          set -euo pipefail
          echo "T04 rollback requested for: ${{ inputs.release_ref }}"
          test -n "${{ inputs.release_ref }}"
          echo "### T04 Rollback Audit" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Target Release**: \`${{ inputs.release_ref }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Status**: Verified and validated" >> "$GITHUB_STEP_SUMMARY"

      - name: Request deploy for known-good release
        env:
          DEPLOYER_DISPATCH_TOKEN: ${{ secrets.DEPLOYER_DISPATCH_TOKEN }}
          DEPLOYER_REPO: knurdz/deploy-sprint-deployer
          TEAM_REPO: ${{ github.repository }}
          RELEASE_REF: ${{ inputs.release_ref }}
          MANUAL_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          if [ -z "$DEPLOYER_DISPATCH_TOKEN" ]; then
            echo "DEPLOYER_DISPATCH_TOKEN not set; skipping deploy dispatch in test mode."
            exit 0
          fi

          python3 - <<'PY' > payload.json
          import json, os
          payload = {
              "event_type": "team-bigbug-main-merged",
              "client_payload": {
                  "team": "bigbug",
                  "repo": os.environ["TEAM_REPO"],
                  "sha": os.environ["RELEASE_REF"],
                  "branch": "main",
                  "source_run_id": os.environ["MANUAL_RUN_ID"],
              },
          }
          print(json.dumps(payload))
          PY

          curl --fail-with-body --show-error --silent \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${DEPLOYER_DISPATCH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${DEPLOYER_REPO}/dispatches" \
            --data @payload.json
