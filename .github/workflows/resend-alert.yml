name: T16 Resend Email Alert

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  send-alert:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Deploy Alert Script
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: node team-site/scripts/send-email-alert.mjs
