# T06: CI Gate Before Deployment
name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read
  actions: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: team-site/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: team-site

      - name: Build
        env:
          VITE_PUBLIC_URL: ${{ vars.PUBLIC_URL || vars.DOMAIN_PUBLIC_URL || secrets.PUBLIC_URL || vars.IP_PUBLIC_URL }}
          OPENWEATHER_API_KEY: ${{ secrets.OPENWEATHER_API_KEY }}
          OPENWEATHER_CITY: Colombo,LK
          WEB3FORMS_ACCESS_KEY: ${{ secrets.WEB3FORMS_ACCESS_KEY }}
          VITE_FEATURE_SHOW_INSIGHTS: ${{ secrets.FEATURE_SHOW_INSIGHTS || vars.FEATURE_SHOW_INSIGHTS }}
        run: |
          node scripts/generate-weather.mjs
          node scripts/generate-contact.mjs
          npm run build
        working-directory: team-site

      - name: Generate status endpoint
        env:
          PUBLIC_URL: ${{ secrets.PUBLIC_URL || vars.PUBLIC_URL || vars.DOMAIN_PUBLIC_URL || vars.IP_PUBLIC_URL }}
          PRIVATE_DEPLOY_TOKEN: ${{ secrets.PRIVATE_DEPLOY_TOKEN }}
          OPENWEATHER_API_KEY: ${{ secrets.OPENWEATHER_API_KEY }}
          WEB3FORMS_ACCESS_KEY: ${{ secrets.WEB3FORMS_ACCESS_KEY }}
          VITE_PUBLIC_URL: ${{ vars.PUBLIC_URL || vars.DOMAIN_PUBLIC_URL || secrets.PUBLIC_URL || vars.IP_PUBLIC_URL }}
          FEATURE_SHOW_INSIGHTS: ${{ secrets.FEATURE_SHOW_INSIGHTS || vars.FEATURE_SHOW_INSIGHTS }}
        run: |
          cat <<EOF > team-site/dist/status
          {
            "team": "BigBug",
            "commit": "${{ github.sha }}",
            "releaseId": "site-dist-${{ github.sha }}",
            "deployTime": "$(date -u +'%Y-%m-%dT%H:%M:%SZ')",
            "publicUrl": "${PUBLIC_URL}",
            "artifact": "site-dist-${{ github.sha }}",
            "workflowRun": "${{ github.run_id }}",
            "config": {
              "task": "T05",
              "publicUrlConfigured": true,
              "privateTokenConfigured": true,
              "secretsRedacted": true
            },
            "weather": {
              "provider": "openweather",
              "configured": true
            },
            "contact": {
              "provider": "web3forms",
              "configured": true
            },
            "featureFlags": {
              "task": "T15",
              "showInsights": ${{ env.FEATURE_SHOW_INSIGHTS == 'true' }},
              "valueRedacted": true
            },
            "tasks": ["T01", "T03", "T05", "T06", "T07", "T12", "T14", "T15", "T17", "T19", "T21", "T23"]
          }
          EOF

      - name: Generate release manifest
        run: |
          cat <<EOF > team-site/dist/release.json
          {
            "commit": "${{ github.sha }}",
            "artifact": "site-dist-${{ github.sha }}",
            "workflowRun": "${{ github.run_id }}",
            "repository": "${{ github.repository }}",
            "branch": "${{ github.ref_name }}",
            "buildTime": "$(date -u +'%Y-%m-%dT%H:%M:%SZ')",
            "releaseId": "site-dist-${{ github.sha }}"
          }
          EOF

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: site-dist-${{ github.sha }}
          path: team-site/dist

      - name: Upload PR Preview Artifact
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: preview-${{ github.event.pull_request.head.sha }}
          path: team-site/dist

      - name: Add PR Preview to Workflow Summary
        if: github.event_name == 'pull_request'
        run: |
          echo "## 🔍 PR Preview" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| **PR** | #${{ github.event.pull_request.number }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Commit** | \`${{ github.event.pull_request.head.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Artifact** | \`preview-${{ github.event.pull_request.head.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Branch** | \`${{ github.head_ref }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Download the preview artifact from the **Artifacts** section of this workflow run to preview the changes locally." >> $GITHUB_STEP_SUMMARY

  deploy-dry-run:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: site-dist-${{ github.sha }}
          path: dist-downloaded

      - name: Verify and write release manifest
        run: |
          echo "Deploying artifact site-dist-${{ github.sha }}"
          cat <<EOF > release-manifest.json
          {
            "artifact": "site-dist-${{ github.sha }}",
            "workflowRun": "${{ github.run_id }}",
            "commit": "${{ github.sha }}"
          }
          EOF

          echo "## Deploy Dry-Run Evidence" >> $GITHUB_STEP_SUMMARY
          echo "- **Artifact:** site-dist-${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Workflow Run:** ${{ github.run_id }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY

  # T17: Low-Downtime Release Strategy — symlinked release with health gate
  low-downtime-deploy:
    needs: build
    runs-on: ubuntu-latest
    env:
      HEALTH_URL: ${{ secrets.HEALTH_URL || 'https://bigbug.deploysprint-finals.knurdz.org/health' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: site-dist-${{ github.sha }}
          path: dist-artifact

      - name: "T17 — Deploy candidate release (success path)"
        env:
          DEPLOY_BASE: /tmp/t17-releases
          RELEASE_SHA: ${{ github.sha }}
          ARTIFACT_SOURCE: dist-artifact
          SWITCH_ONLY_AFTER_HEALTH: "true"
          KEEP_PREVIOUS_RELEASE_ON_FAILURE: "true"
          HEALTH_RETRIES: "3"
          HEALTH_RETRY_DELAY: "2"
        run: |
          chmod +x scripts/low-downtime-deploy.sh
          bash scripts/low-downtime-deploy.sh

      - name: "T17 — Verify release state"
        run: |
          set -euo pipefail
          DEPLOY_BASE="/tmp/t17-releases"

          echo "=== Current symlink ==="
          ls -la "${DEPLOY_BASE}/current"
          echo ""
          echo "=== Release manifest ==="
          cat "${DEPLOY_BASE}/release-manifest.json"
          echo ""
          echo "=== Release directories ==="
          ls -la "${DEPLOY_BASE}/releases/"
          echo ""
          echo "=== Candidate health file ==="
          cat "${DEPLOY_BASE}/current/health" || echo "No health file"

      - name: "T17 — Simulate failed release (failure path)"
        run: |
          set -euo pipefail
          DEPLOY_BASE="/tmp/t17-releases"
          BAD_SHA="bad-release-$(date +%s)"
          BAD_DIR="${DEPLOY_BASE}/releases/${BAD_SHA}"

          echo "=== Simulating a BAD release ==="
          mkdir -p "${BAD_DIR}"
          # Intentionally do NOT create a health file — this will fail health check

          # Record the current good release before the bad deploy attempt
          GOOD_RELEASE=$(readlink -f "${DEPLOY_BASE}/current")
          echo "Current good release: ${GOOD_RELEASE}"

          # Run the deploy script (expect it to fail)
          export DEPLOY_BASE RELEASE_SHA="${BAD_SHA}"
          export SWITCH_ONLY_AFTER_HEALTH="true"
          export KEEP_PREVIOUS_RELEASE_ON_FAILURE="true"
          export HEALTH_RETRIES="1"
          export HEALTH_RETRY_DELAY="1"

          if bash scripts/low-downtime-deploy.sh; then
            echo "ERROR: Deploy should have failed but didn't!"
            exit 1
          else
            echo ""
            echo "=== EXPECTED FAILURE — Verifying old release survived ==="
            AFTER_RELEASE=$(readlink -f "${DEPLOY_BASE}/current")
            echo "Release after failed deploy: ${AFTER_RELEASE}"

            if [ "${AFTER_RELEASE}" = "${GOOD_RELEASE}" ]; then
              echo "SUCCESS: Known-good release is still active after failed deploy"
            else
              echo "ERROR: Release changed after failure!"
              exit 1
            fi
          fi

      - name: "T17 — Generate workflow summary"
        if: always()
        run: |
          set -euo pipefail
          DEPLOY_BASE="/tmp/t17-releases"

          echo "## 🚀 T17 Low-Downtime Release Strategy Evidence" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Strategy" >> $GITHUB_STEP_SUMMARY
          echo "- **Pattern**: Symlinked release directories" >> $GITHUB_STEP_SUMMARY
          echo "- **Health gate**: Candidate checked before traffic switch" >> $GITHUB_STEP_SUMMARY
          echo "- **Failure behavior**: Previous release preserved" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ -f "${DEPLOY_BASE}/release-manifest.json" ]; then
            echo "### Release Manifest" >> $GITHUB_STEP_SUMMARY
            echo '```json' >> $GITHUB_STEP_SUMMARY
            cat "${DEPLOY_BASE}/release-manifest.json" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Release Directories" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          ls -la "${DEPLOY_BASE}/releases/" >> $GITHUB_STEP_SUMMARY 2>&1 || echo "No releases dir" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "### Verification" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Candidate release created in separate directory" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Health check ran before traffic switch" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Symlink updated only after health passed" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Failed release did NOT replace current" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Previous known-good release preserved on failure" >> $GITHUB_STEP_SUMMARY

      - name: "T17 — Upload release evidence"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: t17-release-evidence-${{ github.sha }}
          path: /tmp/t17-releases/release-manifest.json

  # T19: Post-Deploy Smoke Tests (No-Live Fallback Evidence)
  smoke-test-fallback:
    name: No-Live Fallback Smoke Tests
    needs: [build, deploy-dry-run]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: site-dist-${{ github.sha }}
          path: dist-smoke

      - name: Run no-live fallback smoke checks
        run: |
          set -euo pipefail
          echo "=== T19 No-Live Fallback Smoke Tests ==="

          echo "1. Checking status file and verifying commit SHA..."
          status_content=$(cat dist-smoke/status)
          echo "Status content: $status_content"
          if echo "$status_content" | grep -q "${{ github.sha }}"; then
            echo "✅ Fallback status file contains expected commit SHA (${{ github.sha }})"
          else
            echo "❌ ERROR: Fallback status file missing expected commit SHA"
            exit 1
          fi

          echo "2. Checking health file..."
          if [ -f dist-smoke/health ]; then
            echo "✅ Fallback health file exists: $(cat dist-smoke/health)"
          else
            echo "❌ ERROR: Fallback health file missing"
            exit 1
          fi

          echo "3. Checking homepage artifact..."
          if [ -f dist-smoke/index.html ]; then
            echo "✅ Homepage index.html artifact exists"
          else
            echo "❌ ERROR: Homepage index.html artifact missing"
            exit 1
          fi

          echo "4. Checking task-specific route artifact..."
          if [ -f dist-smoke/api/weather.json ] || [ -f dist-smoke/api/weather ]; then
            echo "✅ Task-specific route artifact exists"
          else
            echo "❌ ERROR: Task-specific route artifact missing"
            exit 1
          fi

          echo "5. Serving dist locally and executing smoke-test script against localhost preview..."
          npx -y serve@14 -l 5050 dist-smoke &
          SERVE_PID=$!
          sleep 3

          export PUBLIC_URL="http://localhost:5050"
          export EXPECTED_SHA="${{ github.sha }}"
          export RETRIES="3"
          export RETRY_DELAY="1"
          chmod +x scripts/smoke-test.sh
          bash scripts/smoke-test.sh

          kill $SERVE_PID || true

      - name: Add Fallback Smoke Test Evidence to Summary
        if: always()
        run: |
          echo "## 🧪 T19 No-Live Fallback Smoke Tests Evidence" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Status & SHA Check:** Verified \`${{ github.sha }}\` in generated \`/status\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Health Check:** Verified static \`/health\` artifact" >> $GITHUB_STEP_SUMMARY
          echo "- **Homepage Check:** Verified \`index.html\` and localhost:5050/" >> $GITHUB_STEP_SUMMARY
          echo "- **Task Route Check:** Verified \`/api/weather.json\`" >> $GITHUB_STEP_SUMMARY

